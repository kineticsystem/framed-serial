# Builds the package and runs its tests with industrial_ci, against the main
# and the testing ROS repositories, on top of serial from framed-serial.repos.

name: CI/CD

on: [push, pull_request]

jobs:
  industrial_ci:
    strategy:
      fail-fast: false
      matrix:
        env:
          - { ROS_DISTRO: jazzy, ROS_REPO: testing }
          - { ROS_DISTRO: jazzy, ROS_REPO: main }
    env:
      UPSTREAM_WORKSPACE: framed-serial.repos
    runs-on: ubuntu-24.04
    # A normal run takes a few minutes; fail a stalled one instead of waiting 6 h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: "ros-industrial/industrial_ci@master"
        env: ${{matrix.env}}
